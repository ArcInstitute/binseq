name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build
        run: cargo build --verbose
      - name: Run tests
        run: cargo test --verbose
      - name: Run tests (release)
        run: cargo test --verbose --release

  # `anyhow` and `paraseq` are independent optional toggles, and `zstd-c`/`zstd-rs`
  # (see src/zstdlib/mod.rs) are mutually exclusive backends so `--all-features`
  # can't cover them.
  #
  # Scoped to `--lib`/`--doc`
  feature_matrix:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        backend: [zstd-c, zstd-rs]
        anyhow: [true, false]
        paraseq: [true, false]
    steps:
      - uses: actions/checkout@v7
      - name: Build + test (backend=${{ matrix.backend }}, anyhow=${{ matrix.anyhow }}, paraseq=${{ matrix.paraseq }})
        run: |
          FEATURES="${{ matrix.backend }}"
          if [ "${{ matrix.anyhow }}" = "true" ]; then FEATURES="$FEATURES,anyhow"; fi
          if [ "${{ matrix.paraseq }}" = "true" ]; then FEATURES="$FEATURES,paraseq"; fi
          cargo build --verbose --lib --no-default-features --features "$FEATURES"
          cargo test --verbose --lib --doc --no-default-features --features "$FEATURES"

  fmt_lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Formatting
        run: cargo fmt --check
      - name: Linting (zstd-c backend)
        run: cargo clippy --features paraseq,anyhow,zstd-c --all-targets -- -D warnings
      - name: Linting (zstd-rs backend)
        run: cargo clippy --no-default-features --features paraseq,anyhow,zstd-rs --all-targets -- -D warnings

  example_grep:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        ext: [bq, vbq, cbq]
    steps:
      - uses: actions/checkout@v7
      - name: run example ${{ matrix.ext }}
        run: cargo run --release --example grep -- ./data/subset.${{ matrix.ext }} "ACGTACGT"

  example_range:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        ext: [bq, vbq, cbq]
    steps:
      - uses: actions/checkout@v7
      - name: run example ${{ matrix.ext }}
        run: cargo run --release --example parallel_range -- ./data/subset.${{ matrix.ext }} 4 30 200

  example_write:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        ext: [bq, vbq, cbq]
    steps:
      - uses: actions/checkout@v7
      - name: run example (single) ${{ matrix.ext }}
        run: cargo run --release --example write -- ./data/subset_R1.fastq.gz -o ./output.${{ matrix.ext }}
      - name: run example (paired) ${{ matrix.ext }}
        run: cargo run --release --example write -- ./data/subset_R1.fastq.gz ./data/subset_R2.fastq.gz -o ./output.${{ matrix.ext }}

  example_read:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        ext: [bq, vbq, cbq]
    steps:
      - uses: actions/checkout@v7
      - name: run example ${{ matrix.ext }}
        run: cargo run --release --example read -- ./data/subset.${{ matrix.ext }}
