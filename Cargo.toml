[package]
name = "binseq"
version = "0.9.3"
edition = "2024"
description = "A high efficiency binary format for sequencing data"
license = "MIT"
authors = ["Noam Teyssier <noam.teyssier@arcinstitute.org>"]
repository = "https://github.com/arcinstitute/binseq"
documentation = "https://docs.rs/binseq"
categories = ["science::bioinformatics", "encoding", "data-structures"]
keywords = ["binary", "nucleotide", "sequencing", "genomics", "fastq"]

[dependencies]
anyhow = {version = "1.0.100", optional = true}
auto_impl = "1.3.0"
bitnuc = "0.4.0"
bytemuck = { version = "1.24.0", features = ["derive", "extern_crate_alloc"] }
byteorder = "1.5.0"
itoa = "1.0.17"
libzstd-rs-sys = { version = "0.0.1-prerelease.2", optional = true }
memchr = "2.7.6"
memmap2 = "0.9.9"
num_cpus = "1.17.0"
paraseq = { version = "0.4.8", optional = true }
parking_lot = {version = "0.12.5", optional = true }
rand = { version = "0.9.2", features = ["small_rng"] }
sucds = "0.8.3"
thiserror = "2.0.17"
zstd = { version = "0.13.3", features = ["zstdmt"], optional = true }

[dev-dependencies]
anyhow = "1.0.100"
parking_lot = "0.12.5"
clap = { version = "4.5.54", features = ["derive"] }
criterion = "0.8.2"
paraseq = "0.4.8"

[[bench]]
name = "zstd_backend"
harness = false

[features]
default = ["paraseq", "anyhow", "zstd-c"]
anyhow = ["dep:anyhow"]
paraseq = ["dep:paraseq", "dep:parking_lot"]

# Mutually exclusive zstd backends - see `src/zstdlib/mod.rs`.
zstd-c = ["dep:zstd"]
zstd-rs = ["dep:libzstd-rs-sys"]

# Enables libzstd-rs-sys's `unsafe-performance-experimental` (skips bounds checks in
# a few decompression hot paths via `get_unchecked`/`unreachable_unchecked`).
#
# Exploration and testing shows equivalent results as `zstd-rs` on decompression path
# but likely too unstable to ship as a default
zstd-rs-unsafe-perf = ["zstd-rs", "libzstd-rs-sys/unsafe-performance-experimental"]

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
cast_possible_truncation = "allow"
cast_precision_loss = "allow"
missing_errors_doc = "allow"
struct_excessive_bools = "allow"
fn_params_excessive_bools = "allow"
